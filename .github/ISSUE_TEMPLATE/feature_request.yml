name: Feature request
description: Suggest a responsible improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired user-visible behavior.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Privacy and misuse considerations
      description: Explain any consent, disclosure, storage, or abuse implications.
    validations:
      required: true

