name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private recordings, voice profiles, transcripts, or generated speech.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and VRAM
      placeholder: NVIDIA RTX 4070 Ti, 12 GB

  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      description: Remove paths, personal information, recordings, transcripts, and secrets.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private or identifying data from this report.
          required: true

